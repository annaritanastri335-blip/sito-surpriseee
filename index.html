<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff0f5;
            background-image: radial-gradient(#ffb6c1 1px, transparent 1px);
            background-size: 30px 30px;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden; position: relative;
        }
        .bow { position: absolute; font-size: 24px; opacity: 0.6; }
        .card {
            width: 90%; max-width: 420px; background: rgba(255, 255, 255, 0.95);
            border: 3px solid #ffb6c1; border-radius: 25px; padding: 25px 20px;
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.4); text-align: center;
            display: flex; flex-direction: column; align-items: center; position: relative;
        }
        h1, h2 { font-family: 'Dancing Script', cursive; color: #db7093; font-size: 2rem; margin-bottom: 10px; }
        p { color: #6c5b62; font-size: 0.95rem; margin-bottom: 15px; }
        
        .cat-box { position: relative; width: 110px; height: 110px; margin: 10px 0 20px 0; }
        .nametag {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            background: white; border: 2px solid #ffb6c1; color: #db7093;
            font-size: 0.8rem; font-weight: 700; padding: 2px 8px; border-radius: 10px;
            white-space: nowrap; z-index: 2;
        }
        .cat-svg { width: 100%; height: 100%; }

        .slide { display: none; width: 100%; flex-direction: column; align-items: center; }
        .slide.active { display: flex; }

        .btn {
            background: linear-gradient(135deg, #ffb6c1, #ff69b4); color: white;
            border: none; padding: 10px 25px; font-size: 1rem; font-weight: 700;
            border-radius: 20px; cursor: pointer; font-family: 'Quicksand', sans-serif;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.3); margin-top: 10px;
        }
        .btn-group { display: flex; gap: 15px; position: relative; width: 100%; justify-content: center; min-height: 50px; }
        .btn-no { background: #e0e0e0; color: #777; position: absolute; box-shadow: none; }

        input[type="date"] {
            border: 2px solid #ffb6c1; padding: 10px; border-radius: 15px;
            outline: none; font-family: 'Quicksand', sans-serif; color: #db7093;
            margin-bottom: 10px; text-align: center;
        }
        .hint { font-size: 0.85rem; color: #db7093; font-weight: 700; min-height: 20px; }

        .gold-frame {
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728);
            padding: 10px; border-radius: 12px; margin: 10px 0; width: 100%; max-width: 250px;
        }
        .gold-inner { background: white; padding: 6px; border-radius: 6px; }
        .photo { width: 100%; max-height: 220px; object-fit: cover; border-radius: 4px; display: block; }
    </style>
</head>
<body>

    <div class="bow" style="top: 5%; left: 5%;">🎀</div>
    <div class="bow" style="top: 10%; right: 8%;">✨</div>
    <div class="bow" style="bottom: 8%; left: 8%;">🌸</div>
    <div class="bow" style="bottom: 10%; right: 5%;">🎀</div>

    <div class="card">
        <!-- MASCOTTE -->
        <div class="cat-box">
            <div class="nametag">mimmino 💞</div>
            <svg class="cat-svg" viewBox="0 0 100 100">
                <rect x="25" y="30" width="50" height="45" rx="8" fill="#e0e0e0"/>
                <rect x="30" y="35" width="40" height="35" rx="4" fill="#f5f5f5"/>
                <polygon points="25,30 15,15 35,25" fill="#d6d6d6"/>
                <polygon points="28,28 20,18 33,24" fill="#ffb6c1"/>
                <polygon points="75,30 85,15 65,25" fill="#d6d6d6"/>
                <polygon points="72,28 80,18 67,24" fill="#ffb6c1"/>
                <rect x="42" y="25" width="16" height="8" fill="#a8a8a8"/>
                <g id="eyesNormal">
                    <rect x="35" y="42" width="8" height="12" rx="2" fill="#2e7d32"/>
                    <rect x="57" y="42" width="8" height="12" rx="2" fill="#2e7d32"/>
                </g>
                <g id="eyesCry" style="display:none;">
                    <path d="M 33 48 Q 39 42 45 48" stroke="#555" stroke-width="3" fill="none"/>
                    <path d="M 55 48 Q 61 42 67 48" stroke="#555" stroke-width="3" fill="none"/>
                    <ellipse cx="33" cy="58" rx="2" ry="4" fill="#4fc3f7"/>
                    <ellipse cx="67" cy="58" rx="2" ry="4" fill="#4fc3f7"/>
                </g>
                <g id="eyesHappy" style="display:none;">
                    <path d="M 35 48 C 35 44, 41 42, 41 45 C 41 42, 47 44, 47 48 C 47 52, 41 55, 41 55 C 41 55, 35 52, 35 48 Z" fill="#ff4081"/>
                    <path d="M 53 48 C 53 44, 59 42, 59 45 C 59 42, 65 44, 65 48 C 65 52, 59 55, 59 55 C 59 55, 53 52, 53 48 Z" fill="#ff4081"/>
                </g>
                <polygon points="47,52 53,52 50,55" fill="#ff80ab"/>
            </svg>
        </div>

        <!-- SLIDE 1 -->
        <div class="slide active" id="s1">
            <h1>Do you love me? 💖</h1>
            <p>Pensaci bene prima di rispondere...</p>
            <div class="btn-group" id="bGroup">
                <button class="btn" id="btnYes">Sì 💕</button>
                <button class="btn btn-no" id="btnNo">No 🥺</button>
            </div>
        </div>

        <!-- SLIDE 2 -->
        <div class="slide" id="s2">
            <h2>Do you remember when we got together? 🗓️</h2>
            <p>Scegli la nostra data speciale:</p>
            <input type="date" id="dPick">
            <div class="hint" id="hint">Scegli una data...</div>
            <button class="btn" id="btnDate" style="display:none;">Invia 💌</button>
        </div>

        <!-- SLIDE 3 -->
        <div class="slide" id="s3">
            <div class="gold-frame">
                <div class="gold-inner">
                    <img src="./foto.jpg" alt="Foto" class="photo">
                </div>
            </div>
            <h1>Ti amo da morire tautau 💖</h1>
            <p style="font-style: italic;">Firmato: la tua bimba bella che ti ama da morire ✨</p>
        </div>
    </div>

    <script>
        const eyesN = document.getElementById('eyesNormal');
        const eyesC = document.getElementById('eyesCry');
        const eyesH = document.getElementById('eyesHappy');

        function setCat(state) {
            eyesN.style.display = state === 'normal' ? 'block' : 'none';
            eyesC.style.display = state === 'cry' ? 'block' : 'none';
            eyesH.style.display = state === 'happy' ? 'block' : 'none';
        }

        const btnYes = document.getElementById('btnYes');
        const btnNo = document.getElementById('btnNo');

        btnYes.addEventListener('mouseenter', () => setCat('happy'));
        btnYes.addEventListener('mouseleave', () => setCat('normal'));

        btnNo.addEventListener('mouseenter', () => {
            setCat('cry');
            const rx = (Math.random() - 0.5) * 160;
            const ry = (Math.random() - 0.5) * 80;
            btnNo.style.transform = `translate(${rx}px, ${ry}px)`;
        });

        btnYes.addEventListener('click', () => {
            document.getElementById('s1').classList.remove('active');
            document.getElementById('s2').classList.add('active');
            setCat('normal');
        });

        const dPick = document.getElementById('dPick');
        const btnDate = document.getElementById('btnDate');
        const hint = document.getElementById('hint');

        dPick.addEventListener('input', (e) => {
            if (e.target.value === '2025-08-25') {
                setCat('happy');
                hint.textContent = "Data perfetta! 🥰✨";
                btnDate.style.display = "inline-block";
            } else {
                setCat('cry');
                hint.textContent = "Sbagliato... riprova! 🥺";
                btnDate.style.display = "none";
            }
        });

        btnDate.addEventListener('click', () => {
            document.getElementById('s2').classList.remove('active');
            document.getElementById('s3').classList.add('active');
            setCat('happy');
        });
    </script>
</body>
</html>
