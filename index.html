<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-light: #fff0f5;
            --pink-soft: #ffe4e1;
            --pink-main: #ffb6c1;
            --pink-deep: #ff69b4;
            --pink-dark: #db7093;
            --white: #ffffff;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--pink-light);
            background-image: 
                radial-gradient(var(--pink-main) 1px, transparent 1px),
                radial-gradient(var(--pink-main) 1px, var(--pink-light) 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            color: #5a4b51;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .bow-decor {
            position: absolute;
            font-size: 24px;
            pointer-events: none;
            opacity: 0.6;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        .container {
            width: 90%;
            max-width: 500px;
            min-height: 550px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border: 3px solid var(--pink-main);
            border-radius: 30px;
            padding: 30px 20px;
            box-shadow: 0 15px 35px rgba(255, 182, 193, 0.4),
                        0 0 0 10px rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 10;
        }

        .slide {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-align: center;
            animation: fadeIn 0.5s ease-in-out forwards;
        }

        .slide.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        h1, h2 {
            font-family: 'Dancing Script', cursive;
            color: var(--pink-dark);
            font-size: 2.2rem;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        p {
