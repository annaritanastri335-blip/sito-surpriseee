<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-light: #fff0f5;
            --pink-soft: #ffe4e1;
            --pink-main: #ffb6c1;
            --pink-deep: #ff69b4;
            --pink-dark: #db7093;
            --white: #ffffff;
            --gold: #d4af37;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--pink-light);
            background-image: 
                radial-gradient(var(--pink-main) 1px, transparent 1px),
                radial-gradient(var(--pink-main) 1px, var(--pink-light) 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            color: #5a4b51;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .bow-decor {
            position: absolute;
            font-size: 24px;
            pointer-events: none;
            opacity: 0.6;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        .container {
            width: 90%;
            max-width: 500px;
            min-height: 550px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border: 3px solid var(--pink-main);
            border-radius: 30px;
            padding: 30px 20px;
            box-shadow: 0 15px 35px rgba(255, 182, 193, 0.4),
                        0 0 0 10px rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 10;
        }

        .slide {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-align: center;
            animation: fadeIn 0.5s ease-in-out forwards;
        }

        .slide.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        h1, h2 {
            font-family: 'Dancing Script', cursive;
            color: var(--pink-dark);
            font-size: 2.2rem;
            margin-bottom: 15px;
        }

        p {
            color: #6c5b62;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .cat-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 15px 0;
        }

        .nametag {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--white);
            border: 2px solid var(--pink-main);
            color: var(--pink-dark);
            font-size: 0.85rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
            white-space: nowrap;
            box-shadow: 0 4px 8px rgba(255, 182, 193, 0.3);
            z-index: 5;
        }

        .cat-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 8px 15px rgba(219, 112, 147, 0.2));
            transition: transform 0.3s ease;
        }

        .tear { opacity: 0; }
        .heart-eye { opacity: 0; }
        .sad-eye { opacity: 0; }
        .happy-eye { opacity: 0; }

        .cat-state-happy .heart-eye { opacity: 1; }
        .cat-state-happy .normal-eye { opacity: 0; }
        
        .cat-state-crying .tear { opacity: 1; animation: cry 0.8s infinite linear; }
        .cat-state-crying .normal-eye { opacity: 0; }
        .cat-state-crying .sad-eye { opacity: 1; }

        .cat-state-sad .sad-eye { opacity: 1; }
        .cat-state-sad .normal-eye { opacity: 0; }

        .cat-state-veryhappy .happy-eye { opacity: 1; }
        .cat-state-veryhappy .normal-eye { opacity: 0; }

        @keyframes cry {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(15px); opacity: 0; }
        }

        .btn-group {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            position: relative;
            width: 100%;
            justify-content: center;
            min-height: 60px;
        }

        .btn {
            background: linear-gradient(135deg, #ffb6c1, #ff69b4);
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(255, 105, 180, 0.3);
            transition: all 0.2s ease;
            outline: none;
            font-family: 'Quicksand', sans-serif;
        }

        .btn-no {
            background: #e0e0e0;
            color: #777;
            box-shadow: none;
            position: absolute;
            transition: all 0.15s ease-out;
        }

        .date-input-container {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        input[type="date"] {
            border: 2px solid var(--pink-main);
            padding: 12px 20px;
            border-radius: 20px;
            outline: none;
            font-family: 'Quicksand', sans-serif;
            font-size: 1rem;
            color: var(--pink-dark);
            background: white;
            box-shadow: 0 4px 10px rgba(255, 182, 193, 0.2);
            text-align: center;
            cursor: pointer;
        }

        .proximity-bar-bg {
            width: 80%;
            height: 10px;
            background: #f0f0f0;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 5px;
        }

        .proximity-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffb6c1, #ff69b4);
            transition: width 0.3s ease, background 0.3s ease;
        }

        .hint-text {
            font-size: 0.85rem;
            color: var(--pink-dark);
            font-weight: 600;
            min-height: 20px;
        }

        .gold-frame-wrapper {
            position: relative;
            padding: 15px;
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2),
                        inset 0 0 10px rgba(255,255,255,0.8);
            margin: 10px 0;
            max-width: 280px;
        }

        .gold-frame-inner {
            background: white;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #b38728;
        }

        .photo-img {
            width: 100%;
            max-height: 260px;
            object-fit: cover;
            border-radius: 5px;
            display: block;
        }

        .ribbon-top-left, .ribbon-top-right {
            position: absolute;
            top: -8px;
            font-size: 20px;
        }

        .ribbon-top-left { left: -8px; transform: rotate(-20deg); }
        .ribbon-top-right { right: -8px; transform: rotate(20deg); }

        .final-caption {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: var(--pink-dark);
            margin: 10px 0 5px 0;
        }

        .signature {
            font-size: 0.95rem;
            color: #7a6b71;
            font-style: italic;
            line-height: 1.3;
        }
    </style>
</head>
